services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: queueflow
      POSTGRES_PASSWORD: queueflow
      POSTGRES_DB: queueflow
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueflow"]
      interval: 2s
      timeout: 2s
      retries: 30

  queueflow:
    build: ../queueflow-core-rs
    restart: unless-stopped
    command: >
      queueflow serve
      --mode api
      --default-queue orders
      --api-keys shipit-key:shipit
      --worker-token shipit-worker-token
      --retention-hours 168
    environment:
      DATABASE_URL: postgres://queueflow:queueflow@postgres:5432/queueflow
      RUST_LOG: info
    ports:
      - "8000:8000"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
