services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: queueflow
      POSTGRES_PASSWORD: queueflow
      POSTGRES_DB: queueflow
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueflow"]
      interval: 2s
      timeout: 2s
      retries: 30

  queueflow:
    # The published engine image - no Rust toolchain or sibling checkout
    # needed. Pin the minor; pass --build via 'docker compose build' against
    # ../queueflow-core-rs only when hacking on the engine itself.
    image: ghcr.io/elision-labs/queueflow:0.2
    restart: unless-stopped
    # The image ENTRYPOINT is the queueflow binary; command supplies args only.
    # The two credentials come from .env (cp .env.example .env); compose
    # refuses to start without them rather than falling back to known values.
    command: >
      serve
      --mode api
      --default-queue orders
      --api-keys ${QUEUEFLOW_TOKEN:?set QUEUEFLOW_TOKEN in .env (cp .env.example .env)}:shipit
      --worker-token ${QUEUEFLOW_WORKER_TOKEN:?set QUEUEFLOW_WORKER_TOKEN in .env (cp .env.example .env)}
      --retention-hours 168
    environment:
      DATABASE_URL: postgres://queueflow:queueflow@postgres:5432/queueflow
      RUST_LOG: info
    ports:
      - "8000:8000"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
